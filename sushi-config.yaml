id: openanimalnutrition.fhir.animalnutrition
canonical: https://openanimalnutrition.org/fhir/animal-nutrition
name: OpenAnimalNutrition
title: "Open Animal Nutrition — Adequacy Interoperability Guide"
description: >-
  A FHIR Implementation Guide for representing and verifying the nutritional
  adequacy of an animal diet against published requirement standards (NRC,
  AAFCO, FEDIAF), expressed on a common mathematical basis. Species-agnostic by
  design; v0.1 binds canine and feline coverage. This guide models the adequacy
  VERDICT, not the means of producing a passing diet.
status: draft
